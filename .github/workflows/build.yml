name: Build Pulguita IA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "Cython==0.29.37"

      - name: Preparar Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"
          cd "$HOME/.buildozer/android/platform/android-sdk"

          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip

          unzip -q sdk-tools-linux-4333796.zip

          rm sdk-tools-linux-4333796.zip

          chmod +x tools/bin/sdkmanager

          yes | tools/bin/sdkmanager --licenses || true

      - name: Compilar APK
        run: |
          yes | buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulguita-IA-APK
          path: bin/*.apk
