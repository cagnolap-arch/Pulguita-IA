name: Crear APK de Pulguita IA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Aceptar licencias Android
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Pulguita-IA-APK
          path: bin/*.apk
          if-no-files-found: error
